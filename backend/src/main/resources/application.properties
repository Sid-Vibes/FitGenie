spring.application.name=fitnessAnalysisApplication
# Import secret properties
spring.config.import=optional:file:./application-secret.properties

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fitness_db
#spring.datasource.username = {secret}
#spring.datasource.password = {secret}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Security
# jwt.secret={secret}
logging.level.org.springframework.security=DEBUG
logging.level.in.fitnessAnalysisApplication=DEBUG


# FitGenie ML Service
ml.service.base-url=http://localhost:8000
#ml.service.api-key={secret}